# .github/workflows/commit-review.yml
name: Claude commit review
on: push
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review the changes in commit ${{ github.sha }} (git show HEAD).
            Point out bugs, security issues, and unclear code; summarize what changed.
            Post the review as a commit comment with:
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="<review>"
        env:
          GH_TOKEN: ${{ github.token }}
